name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux GUI prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth tesseract-ocr
      - name: Linux GUI controls and clipboard-handler smoke test
        run: xvfb-run -a node scripts/test-desktop.js
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and CLI tests
        run: node scripts/ci-test.js
      - name: Print skips and fail if a Linux bash test was skipped
        run: node scripts/assert-skips.js tap.txt
      - name: Generated docs are current
        run: node scripts/gen-docs.js --check
      - name: Install previews on every OS and tool
        run: bash scripts/preview-matrix.sh --quiet
  windows:
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and CLI tests
        run: node scripts/ci-test.js
      - name: Print skips
        run: node scripts/assert-skips.js tap.txt
      - name: Generated docs are current
        run: node scripts/gen-docs.js --check
      - name: Windows self-test
        run: ./scripts/windows-selftest.ps1
      - name: Native Windows GUI controls and clipboard-handler smoke test
        run: node scripts/test-desktop.js
  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node:20-bookworm
            packages: apt
            allow_fail: false
          - image: node:22-bookworm
            packages: apt
            allow_fail: false
          - image: node:24-bookworm
            packages: apt
            allow_fail: false
          - image: node:22-alpine
            packages: apk
            allow_fail: true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_fail }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Packages
        run: |
          if [ "${{ matrix.packages }}" = "apk" ]; then apk add --no-cache git bash ca-certificates; else apt-get update && apt-get install -y git ca-certificates; fi
      - uses: actions/checkout@v4
      - name: Node 20 still runs and names its end of life
        if: matrix.image == 'node:20-bookworm'
        run: node -e "const n=require('./lib/platform').nodeNotice(process.version); if(!n) process.exit(1); console.log(n)"
      - name: Unit and CLI tests
        run: node --test --test-reporter tap test/*.test.js > tap.txt
      - name: Print skips and fail if a bash test was skipped
        run: node scripts/assert-skips.js tap.txt
  container-nonroot:
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - name: Packages
        run: apt-get update && apt-get install -y git ca-certificates
      - uses: actions/checkout@v4
      - name: Unit tests as the node user
        run: su node -s /bin/bash -c "node --test test/platform.test.js"

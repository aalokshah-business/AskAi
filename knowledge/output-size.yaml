id: output-size
title: Shorter replies
tags:
  - output
  - reply
  - diff
  - verbose
  - length
  - shorter
  - caveman
  - terse
rule: On by default: the terse rule (Caveman-style), the diff-only rule, Codex verbosity low, and the output line in askai prompt. For one task: askai prompt --output diff.
why: Output tokens cost about five times input on Claude. Caveman itself advertises 65% fewer output tokens; independent measurement across six studies puts the real median at about 8% — use the measured number, not the vendor claim.
auto: askai prompt --output diff; --caveman ultra for the shortest replies
